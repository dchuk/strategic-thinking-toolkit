<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strategic Thinking Toolkit — Visual Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Bricolage+Grotesque:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/canvas.css" />
  <style>
    :root {
      --bg:        #f4efe6;       /* warm parchment cream */
      --surface:   #faf6ed;       /* lighter cream for cards */
      --ink:       #1a2238;       /* deep midnight navy */
      --ink-soft:  #3d4868;       /* secondary text */
      --muted:     #6b7280;
      --border:    #d9cfbf;       /* warm tan */
      --border-soft: #e8e0d2;
      --front:     #e8c4a0;       /* warm sand — strategy zone */
      --front-ink: #7c3f12;
      --top:       #b8cda9;       /* sage — defend / marketing */
      --top-ink:   #3f5a2e;
      --back:      #d6cdc0;       /* muted clay — back-burner */
      --back-ink:  #5a4f40;
      --accent:    #c1542c;       /* terracotta */
      --accent-ink:#8a3814;
      --warn:      #b45309;

      --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
      --font-body:    "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono:    "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    header.companion-header {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 14px 24px 12px;
      background: var(--ink); color: var(--bg);
      border-bottom: 1px solid #0d1322;
    }
    header.companion-header .title {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 17px;
      letter-spacing: -0.01em;
    }
    header.companion-header .title #exercise-name {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.6;
      margin-left: 4px;
    }
    header.companion-header .context {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.55;
    }
    .companion-status {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 5px 24px;
      background: #fef3c7; color: #92400e;
      border-bottom: 1px solid #fde68a;
    }
    .companion-status[data-ok="1"] {
      background: transparent; color: var(--ink-soft);
      border-bottom-color: var(--border-soft);
    }
    main.companion-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 36px 28px 72px;
    }
    .annotations {
      position: fixed; right: 20px; bottom: 20px;
      width: 320px; max-height: 50vh; overflow: auto;
      display: flex; flex-direction: column-reverse; gap: 8px;
      pointer-events: none;
    }
    .annotation {
      pointer-events: auto;
      background: var(--surface); border: 1px solid var(--border); color: var(--ink);
      border-radius: 4px; padding: 10px 12px; font-size: 13px;
      box-shadow: 0 2px 12px rgba(26,34,56,0.08);
    }
    .annotation .from {
      font-family: var(--font-mono);
      font-weight: 500; font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--accent); margin-bottom: 4px;
    }
    button {
      font: inherit;
      font-weight: 500;
      padding: 8px 16px; border-radius: 4px;
      border: 1px solid var(--border); background: var(--surface); color: var(--ink);
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
    }
    button:hover { background: #fff; border-color: var(--ink-soft); }
    button.primary {
      background: var(--ink); color: var(--bg); border-color: var(--ink);
      font-weight: 500;
    }
    button.primary:hover { background: #0d1322; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
  </style>
</head>
<body>
  <header class="companion-header">
    <span class="title">Strategic Thinking — <span id="exercise-name"><!--EXERCISE--></span></span>
    <span class="context"><!--CONTEXT--></span>
  </header>
  <div class="companion-status" id="connection-status">Connecting…</div>
  <main class="companion-shell">
    <!--CANVAS-->
  </main>
  <aside class="annotations" id="annotations"></aside>
  <script src="/helper.js"></script>
  <script src="/client-bridge.js"></script>
  <script>
    // Render incoming annotations as toast cards.
    window.companion.onAnnotation(function (a) {
      var box = document.getElementById('annotations');
      if (!box) return;
      var el = document.createElement('div');
      el.className = 'annotation';
      var from = document.createElement('div');
      from.className = 'from';
      from.textContent = (a.from || 'claude').toUpperCase() + (a.target ? ' · ' + a.target : '');
      var body = document.createElement('div');
      body.textContent = a.text || '';
      el.appendChild(from); el.appendChild(body);
      box.prepend(el);
    });
  </script>
  <script src="/canvas.js"></script>
</body>
</html>
